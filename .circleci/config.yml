    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_MIGRATION_CHECK=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Check for conflicting migration and service changes
          command: |
            echo "Checking that migrations and service changes are not in the same commit..."
            echo "This is a CI-only static check - conflicts are detected at PR level in GHA."
