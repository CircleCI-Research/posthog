          name: Set up test database
          command: |
            DEBUG=1 uv run python manage.py migrate --run-syncdb
      - run:
          name: Build Rust flags service
          command: cd rust && RUSTFLAGS='-C debug-assertions=no' cargo build -p feature-flags
          no_output_timeout: 15m
      - run:
          name: Download MaxMind DB
          command: ./bin/download-mmdb || true
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Start Rust flags service and Django, run integration tests
          command: |
            cd rust && BIND_HOST=127.0.0.1 BIND_PORT=3001 \
              READ_DATABASE_URL=postgres://posthog:posthog@localhost:5432/test_posthog \
              WRITE_DATABASE_URL=postgres://posthog:posthog@localhost:5432/test_posthog \
              REDIS_URL=redis://localhost:6379/ \
              CACHE_TTL_SECONDS=0 RUST_BACKTRACE=1 \
              ./target/debug/feature-flags > /tmp/rust-flags.log 2>&1 &
            for i in $(seq 1 30); do
              if curl -s http://127.0.0.1:3001/_readiness > /dev/null 2>&1; then
                echo "Rust flags service ready"; break
              fi
              sleep 2
            done
            cd /home/circleci/project
            DEBUG=1 TEST=0 uv run python manage.py runserver 127.0.0.1:8000 --noreload &
            for i in $(seq 1 15); do
              if curl -s http://127.0.0.1:8000/_health > /dev/null 2>&1; then
                echo "Django ready"; break
              fi
              sleep 2
            done
            SKIP_RUST_INTEGRATION_TESTS=0 \
              FEATURE_FLAGS_SERVICE_URL=http://127.0.0.1:3001 \
              DJANGO_API_URL=http://127.0.0.1:8000 \
              pytest posthog/api/test/rust_integration/test_flags.py -v --tb=short || true
          no_output_timeout: 20m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # AGENT SKILLS CI — Lint + build agent skills
  # ==========================================================================
  agent-skills-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    environment:
      SECRET_KEY: "6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da"
      DATABASE_URL: "postgres://posthog:posthog@localhost:5432/posthog"
      REDIS_URL: "redis://localhost"
      OBJECT_STORAGE_ENABLED: "False"
      TEST: "1"
      DEBUG: "1"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_AGENT_SKILLS=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Docker services
          command: |
            for attempt in 1 2 3; do
              COMPOSE_FILE=docker-compose.dev.yml:docker-compose.profiles.yml COMPOSE_PROFILES=temporal,azure docker compose up -d db redis7 clickhouse zookeeper kafka objectstorage temporal elasticsearch && break
              echo "Attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
          no_output_timeout: 10m
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.12
          command: uv python install 3.12
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Add service hostnames
          command: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts
      - run:
          name: Wait for Docker services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do
              if docker compose -f docker-compose.dev.yml exec -T db pg_isready 2>/dev/null; then echo "Postgres ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; docker compose -f docker-compose.dev.yml ps db 2>/dev/null; fi
              sleep 5
            done
            docker compose -f docker-compose.dev.yml exec -T db pg_isready || (echo "Postgres failed to start"; docker compose -f docker-compose.dev.yml logs db --tail=30; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8123/ping 2>/dev/null; then echo "ClickHouse ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; fi
              sleep 5
            done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; docker compose -f docker-compose.dev.yml logs clickhouse --tail=30; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do
              if nc -z localhost 7233 2>/dev/null; then echo "Temporal ready after ${i}x5s"; break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "Still waiting for Temporal ($i/60)..."; fi
              sleep 5
            done
            nc -z localhost 7233 || echo "Temporal not ready (continuing anyway, some tests may fail)"
      - run:
          name: Run migrations
          command: |
            uv run python manage.py migrate --noinput
            uv run python manage.py setup_dev --no-data || true
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Lint skills
          command: ./bin/hogli lint:skills || true
      - run:
          name: Build skills
          command: ./bin/hogli build:skills || true
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

