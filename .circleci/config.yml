      CLICKHOUSE_VERIFY: "False"
      OBJECT_STORAGE_ENABLED: "True"
      OBJECT_STORAGE_ENDPOINT: "http://localhost:19000"
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      GITHUB_ACTIONS: "true"
      OPT_OUT_CAPTURE: "1"
      SKIP_SERVICE_VERSION_REQUIREMENTS: "1"
      NO_RESTART_LOOP: "1"
      DISABLE_SECURE_SSL_REDIRECT: "True"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_MCP_INTEGRATION=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Docker services
          command: |
            python3 -c "
            import re
            base = open('docker/clickhouse/user_defined_function.xml').read()
            latest = open('posthog/user_scripts/latest_user_defined_function.xml').read()
            funcs = re.findall(r'<function>.*?</function>', latest, re.DOTALL)
            merged = base.rsplit('</functions>', 1)[0] + '\n' + '\n'.join(funcs) + '\n</functions>\n'
            open('docker/clickhouse/user_defined_function.xml', 'w').write(merged)
            print(f'Merged {len(funcs)} versioned UDFs alongside unversioned')
            " || true
            docker compose -f docker-compose.dev.yml down || true
            docker compose -f docker-compose.dev.yml up -d
          no_output_timeout: 5m
      - run:
          name: Add service hostnames
          command: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.12
          command: uv python install 3.12
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: export DEBIAN_FRONTEND=noninteractive && sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true && sudo -E apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install pnpm
          command: npm install -g pnpm
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - run:
          name: Install Node dependencies
          command: pnpm --filter=@posthog/mcp... --filter='./products/*' install --frozen-lockfile
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Set up needed files
          command: |
            mkdir -p frontend/dist
            touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
      - run:
          name: Wait for Docker services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do
              if docker compose -f docker-compose.dev.yml exec -T db pg_isready 2>/dev/null; then echo "Postgres ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; docker compose -f docker-compose.dev.yml ps db 2>/dev/null; fi
              sleep 5
            done
            docker compose -f docker-compose.dev.yml exec -T db pg_isready || (echo "Postgres failed to start"; docker compose -f docker-compose.dev.yml logs db --tail=30; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8123/ping 2>/dev/null; then echo "ClickHouse ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; fi
              sleep 5
            done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; docker compose -f docker-compose.dev.yml logs clickhouse --tail=30; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do
              if nc -z localhost 7233 2>/dev/null; then echo "Temporal ready after ${i}x5s"; break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "Still waiting for Temporal ($i/60)..."; fi
              sleep 5
            done
            nc -z localhost 7233 || echo "Temporal not ready (continuing anyway, some tests may fail)"
      - run:
          name: Run migrations and seed data
          command: |
            uv run python manage.py migrate --noinput
            uv run python manage.py migrate_clickhouse
            uv run python manage.py generate_demo_data --n-clusters 10 --days-past 7 --days-future 0 --skip-materialization --skip-flag-sync --skip-user-product-list || true
      - run:
          name: Start PostHog web
          command: |
            uv run python manage.py run_autoreload_celery --type=worker &> /tmp/celery.log &
            uv run python -m granian --interface asgi posthog.asgi:application --host 0.0.0.0 --port 8000 --workers 1 &> /tmp/server.log &
          no_output_timeout: 3m
      - run:
          name: Wait for PostHog
          command: |
            if ! timeout 360 bash -c 'until curl -sf http://localhost:8000; do sleep 2; done'; then
              echo "=== PostHog server failed to start; dumping logs ==="
              echo "--- /tmp/server.log ---"; tail -200 /tmp/server.log 2>/dev/null || echo "(no server log)"
              echo "--- /tmp/celery.log ---"; tail -200 /tmp/celery.log 2>/dev/null || echo "(no celery log)"
              exit 1
            fi
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run MCP integration tests
          command: cd services/mcp && pnpm run test:integration || true
          no_output_timeout: 30m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

