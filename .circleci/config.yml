          name: Job Start
          command: echo "JOB_START_E2E_PLAYWRIGHT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Docker services (capture+temporal+ingestion stack to mirror GHA e2e)
          command: |
            python3 -c "
            import re
            base = open('docker/clickhouse/user_defined_function.xml').read()
            latest = open('posthog/user_scripts/latest_user_defined_function.xml').read()
            funcs = re.findall(r'<function>.*?</function>', latest, re.DOTALL)
            merged = base.rsplit('</functions>', 1)[0] + '\n' + '\n'.join(funcs) + '\n</functions>\n'
            open('docker/clickhouse/user_defined_function.xml', 'w').write(merged)
            print(f'Merged {len(funcs)} versioned UDFs alongside unversioned')
            " || true
            # GHA e2e-playwright starts capture+temporal+ingestion stack: plugins + 6 ingestion workers + maildev for password reset emails
            docker compose -f docker-compose.dev.yml -f docker-compose.profiles.yml down || true
            COMPOSE_FILE=docker-compose.dev.yml:docker-compose.profiles.yml COMPOSE_PROFILES=capture,temporal,ingestion docker compose up -d \
              db redis7 clickhouse zookeeper kafka objectstorage temporal elasticsearch maildev \
              plugins ingestion-general ingestion-sessionreplay recording-api ingestion-error-tracking ingestion-logs ingestion-traces
          no_output_timeout: 8m
      - run:
          name: Add service hostnames
          command: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.12
          command: uv python install 3.12
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli || true
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install pnpm
          command: npm install -g pnpm
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - run:
          name: Install Node dependencies
          command: |
            pnpm --filter=@posthog/playwright... install --frozen-lockfile
            bin/turbo --filter=@posthog/frontend prepare
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Set up needed files
          command: |
            mkdir -p frontend/dist
            touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
            ./bin/download-mmdb || true
      - run:
          name: Wait for Docker services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do
              if docker compose -f docker-compose.dev.yml exec -T db pg_isready 2>/dev/null; then echo "Postgres ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; docker compose -f docker-compose.dev.yml ps db 2>/dev/null; fi
              sleep 5
            done
            docker compose -f docker-compose.dev.yml exec -T db pg_isready || (echo "Postgres failed to start"; docker compose -f docker-compose.dev.yml logs db --tail=30; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8123/ping 2>/dev/null; then echo "ClickHouse ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; fi
              sleep 5
            done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; docker compose -f docker-compose.dev.yml logs clickhouse --tail=30; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do
              if nc -z localhost 7233 2>/dev/null; then echo "Temporal ready after ${i}x5s"; break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "Still waiting for Temporal ($i/60)..."; fi
              sleep 5
            done
            nc -z localhost 7233 || echo "Temporal not ready (continuing anyway, some tests may fail)"
      - run:
          name: Build frontend
          command: |
            pnpm --filter=@posthog/frontend... install --frozen-lockfile
            pnpm --filter=@posthog/frontend build:products
            pnpm --filter=@posthog/frontend build
      - run:
          name: Collect static files
          command: |
            cp frontend/node_modules/@posthog/rrweb/dist/image-bitmap-data-url-worker-*.js.map frontend/dist/ || true
            uv run python manage.py collectstatic --noinput
      - run:
          name: Install sqlx-cli (for persons-db Rust migrations)
          command: |
            if [ ! -x "$HOME/.cargo/bin/sqlx" ]; then
              cargo install sqlx-cli --locked --version 0.8.3 --no-default-features --features native-tls,postgres
            fi
      - run:
          name: Create test databases and run migrations
          command: |
            # Wait for db, then create both posthog_e2e_test (Django) and posthog_persons_e2e_test (Rust persons)
            until docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -d posthog -c 'SELECT 1' >/dev/null 2>&1; do sleep 2; done
            docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -d posthog -c "CREATE DATABASE posthog_e2e_test;" 2>&1 | grep -v "already exists" || true
            docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -d posthog -c "CREATE DATABASE posthog_persons_e2e_test;" 2>&1 | grep -v "already exists" || true
            # Django migrations on the main e2e DB
            uv run python manage.py migrate --noinput
            # Rust migrations on the persons-only DB (mirrors GHA's sqlx setup)
            sqlx migrate run -D "$PERSONS_DB_WRITER_URL" --source rust/persons_migrations/ || true
            uv run python manage.py migrate_clickhouse 2>&1
            uv run python manage.py setup_dev
      - run:
          name: Install Playwright browsers
          command: |
            # --with-deps runs apt-get; needrestart (Ubuntu 22.04) opens an interactive dialog when
            # libraries change. NEEDRESTART_MODE=a auto-restarts daemons without prompting.
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=a
            export NEEDRESTART_SUSPEND=1
            pnpm --filter=@posthog/playwright exec playwright install chromium --with-deps
          no_output_timeout: 15m
      - run:
          name: Start PostHog web, Celery worker, Temporal worker (mirror GHA e2e)
          command: |
            # Source celery-queues.env so the worker consumes 'exports' queue (needed for CSV/XLSX export tests)
            source ./bin/celery-queues.env
            export CELERY_WORKER_QUEUES
            uv run python manage.py run_autoreload_celery --type=worker &> /tmp/celery.log &
            uv run python manage.py start_temporal_worker --task-queue analytics-platform-task-queue &> /tmp/temporal-worker.log &
            uv run python -m granian --interface asgi posthog.asgi:application --host 0.0.0.0 --port 8000 --log-level debug --workers 2 &> /tmp/server.log &
          no_output_timeout: 3m
      - run:
          name: Wait for PostHog to be ready
          command: |
            if ! timeout 360 bash -c 'until curl -sf http://localhost:8000; do sleep 2; done'; then
              echo "=== PostHog server failed to start; dumping logs ==="
              echo "--- /tmp/server.log ---"; tail -200 /tmp/server.log 2>/dev/null || echo "(no server log)"
              echo "--- /tmp/celery.log ---"; tail -200 /tmp/celery.log 2>/dev/null || echo "(no celery log)"
              exit 1
            fi
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run Playwright tests
          command: pnpm --filter=@posthog/playwright exec playwright test --workers=4 --max-failures=5 --update-snapshots
          no_output_timeout: 45m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

