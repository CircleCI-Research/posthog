# PostHog CI — CircleCI Mirror for Benchmarking
# Mirrors ALL PostHog GHA CI workflows (30 workflows, ~48 jobs)
# Clean benchmark run trigger: 2026-05-07
version: 2.1

# ---------------------------------------------------------------------------
# Shared environment variables (match GHA env blocks)
# ---------------------------------------------------------------------------

parameters:
  run-all:
    type: boolean
    default: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:

  # ==========================================================================
  # SYSBENCH — Synthetic hardware benchmark
  # ==========================================================================
  sysbench:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    environment:
      JOB_NAME: sysbench
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_SYSBENCH=$(date +%s%N)"
      - run:
          name: Install sysbench
          command: export DEBIAN_FRONTEND=noninteractive && sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true && sudo -E apt-get install -y sysbench
      - run:
          name: System Info
          command: |
            echo "=== CPU ==="
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|MHz'
            echo "=== Memory ==="
            free -h
            echo "=== Disk ==="
            df -h .
            echo "=== Kernel ==="
            uname -r
      - run:
          name: CPU Benchmark
          command: |
            echo "BENCH_START_CPU=$(date +%s%N)"
            sysbench cpu --cpu-max-prime=20000 --threads=2 --time=30 run
            echo "BENCH_DONE_CPU=$(date +%s%N)"
      - run:
          name: Memory Write Benchmark
          command: |
            echo "BENCH_START_MEM_WRITE=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=write --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_WRITE=$(date +%s%N)"
      - run:
          name: Memory Read Benchmark
          command: |
            echo "BENCH_START_MEM_READ=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=read --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_READ=$(date +%s%N)"
      - run:
          name: File IO Sequential Write
          command: |
            echo "BENCH_START_FILEIO_SEQWR=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqwr --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQWR=$(date +%s%N)"
      - run:
          name: File IO Sequential Read
          command: |
            echo "BENCH_START_FILEIO_SEQRD=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqrd --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQRD=$(date +%s%N)"
      - run:
          name: File IO Random Read/Write
          command: |
            echo "BENCH_START_FILEIO_RNDRW=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=rndrw --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_RNDRW=$(date +%s%N)"
      - run:
          name: Job Done
          command: echo "JOB_DONE_SYSBENCH=$(date +%s%N)"

  # ==========================================================================
  # PYTHON CI — Ruff, mypy, type checking (no Docker needed)
  # ==========================================================================
  python-code-quality:
    docker:
      - image: cimg/python:3.12
    resource_class: large.gen2
    environment:
      UV_HTTP_TIMEOUT: "120"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_PYTHON_CODE_QUALITY=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli || true
      - restore_cache:
          keys:
            - uv-python-{{ checksum "uv.lock" }}
            - uv-python-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: UV_PROJECT_ENVIRONMENT=$HOME/.pyenv/versions/3.12*/envs/main uv sync --frozen --dev || uv sync --frozen --dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - save_cache:
          key: uv-python-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Download GeoIP database
          command: ./bin/download-mmdb || true
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Ruff check
          command: uv run ruff check .
      - run:
          name: Ruff format check
          command: uv run ruff format --check --diff .
      - run:
          name: Mypy type checking
          command: uv run mypy --cache-fine-grained . || true
      - run:
          name: Run hogli tests
          command: uv run pytest common/hogli/tests/ -v --junitxml=junit-hogli.xml || true
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"
      - store_test_results:
          path: junit-hogli.xml

  # ==========================================================================
  # FRONTEND CI — Lint + Jest (no Docker needed)
  # ==========================================================================
  frontend-format:
    docker:
      - image: cimg/node:lts
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_FRONTEND_FORMAT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - restore_cache:
          keys:
            - pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-frontend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: |
            pnpm --filter=@posthog/playwright... install --frozen-lockfile
            bin/turbo --filter=@posthog/frontend prepare
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - save_cache:
          key: pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.local/share/pnpm/store
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Lint with Oxlint
          command: pnpm exec oxlint --quiet
      - run:
          name: Lint CSS with Stylelint
          command: pnpm run lint:css
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  frontend-typescript:
    docker:
      - image: cimg/node:lts
    resource_class: 2xlarge
    environment:
      NODE_OPTIONS: "--max-old-space-size=16384"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_FRONTEND_TYPESCRIPT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - restore_cache:
          keys:
            - pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-frontend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: |
            pnpm --filter=@posthog/playwright... install --no-frozen-lockfile
            bin/turbo --filter=@posthog/frontend prepare
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Build products
          command: pnpm --filter=@posthog/frontend build:products
      - run:
          name: TypeScript strict check
          command: pnpm --filter=@posthog/frontend typescript:check
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  jest:
    parameters:
      segment:
        type: string
      chunk:
        type: integer
    docker:
      - image: cimg/node:lts
    resource_class: large.gen2
    environment:
      NODE_OPTIONS: "--max-old-space-size=16384"
      SHARD_INDEX: << parameters.chunk >>
      SHARD_COUNT: "2"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_JEST_<< parameters.segment >>_<< parameters.chunk >>=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Remove ee (FOSS only)
          command: |
            if [ "<< parameters.segment >>" = "FOSS" ]; then rm -rf ee; fi
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - restore_cache:
          keys:
            - pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-frontend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: pnpm --filter=@posthog/frontend... install --frozen-lockfile
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run Jest tests
          command: bin/turbo run test --filter=@posthog/frontend -- --maxWorkers=2
          no_output_timeout: 15m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # HOG CI — HogVM/HogQL tests (no Docker needed)
  # ==========================================================================
  hog-tests:
    docker:
      - image: cimg/python:3.12-node
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_HOG_TESTS=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli || true
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev || true
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run HogVM Python tests
          command: uv run pytest common/hogvm || true
      - run:
          name: Install HogVM JS deps
          command: pnpm --filter=@posthog/hogvm install --frozen-lockfile
      - run:
          name: Run HogVM TypeScript tests
          command: pnpm --filter=@posthog/hogvm test || true
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # BACKEND CI — Django tests (needs Docker Compose for services)
  # Full matrix: 38 Core + 7 Core-POE + 7 Temporal = 52 shards
  # ==========================================================================
  django-tests:
    parameters:
      group:
        type: integer
      concurrency:
        type: integer
        default: 38
      segment:
        type: string
        default: "Core"
      person-on-events:
        type: boolean
        default: false
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    environment:
      SECRET_KEY: "6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da"
      DATABASE_URL: "postgres://posthog:posthog@localhost:5432/posthog"
      REDIS_URL: "redis://localhost"
      CLICKHOUSE_HOST: "localhost"
      CLICKHOUSE_SECURE: "False"
      CLICKHOUSE_VERIFY: "False"
      TEST: "1"
      OBJECT_STORAGE_ENABLED: "True"
      OBJECT_STORAGE_ENDPOINT: "http://localhost:19000"
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      GITHUB_ACTIONS: "true"
      UV_HTTP_TIMEOUT: "120"
      DISPLAY: ":99.0"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_DJANGO_<< parameters.segment >>_<< parameters.group >>=$(date +%s%N)"
      - run:
          name: Generate test RSA key for OIDC (mirrors GHA OIDC_RSA_FAKE_PRIVATE_KEY var)
          command: |
            openssl genrsa -out /tmp/oidc_rsa.pem 2048 2>/dev/null
            echo 'export OIDC_RSA_PRIVATE_KEY="$(cat /tmp/oidc_rsa.pem)"' >> "$BASH_ENV"
            echo 'export SANDBOX_JWT_PRIVATE_KEY="$(cat /tmp/oidc_rsa.pem)"' >> "$BASH_ENV"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Docker services
          command: |
            python3 -c "
            import re
            base = open('docker/clickhouse/user_defined_function.xml').read()
            latest = open('posthog/user_scripts/latest_user_defined_function.xml').read()
            funcs = re.findall(r'<function>.*?</function>', latest, re.DOTALL)
            merged = base.rsplit('</functions>', 1)[0] + '\n' + '\n'.join(funcs) + '\n</functions>\n'
            open('docker/clickhouse/user_defined_function.xml', 'w').write(merged)
            print(f'Merged {len(funcs)} versioned UDFs alongside unversioned')
            " || true
            COMPOSE_FILE=docker-compose.dev.yml:docker-compose.profiles.yml COMPOSE_PROFILES=temporal,azure docker compose up -d db redis7 clickhouse zookeeper kafka objectstorage temporal elasticsearch
          no_output_timeout: 5m
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.12
          command: uv python install 3.12
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli || true
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - sqlx-cli-v0.8.3-{{ arch }}
      - run:
          name: Install sqlx-cli (used by tests at runtime)
          command: |
            if [ ! -x "$HOME/.cargo/bin/sqlx" ]; then
              cargo install sqlx-cli --locked --version 0.8.3 --no-default-features --features native-tls,postgres
            else
              echo "sqlx already installed: $($HOME/.cargo/bin/sqlx --version)"
            fi
      - save_cache:
          key: sqlx-cli-v0.8.3-{{ arch }}
          paths:
            - ~/.cargo/bin/sqlx
      - restore_cache:
          keys:
            - uv-backend-{{ checksum "uv.lock" }}
            - uv-backend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - save_cache:
          key: uv-backend-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Add service hostnames
          command: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts
      - run:
          name: Set up needed files
          command: |
            mkdir -p frontend/dist
            touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
            ./bin/download-mmdb || true
      - run:
          name: Wait for Docker services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do
              if docker compose -f docker-compose.dev.yml exec -T db pg_isready 2>/dev/null; then echo "Postgres ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; docker compose -f docker-compose.dev.yml ps db 2>/dev/null; fi
              sleep 5
            done
            docker compose -f docker-compose.dev.yml exec -T db pg_isready || (echo "Postgres failed to start"; docker compose -f docker-compose.dev.yml logs db --tail=30; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8123/ping 2>/dev/null; then echo "ClickHouse ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; fi
              sleep 5
            done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; docker compose -f docker-compose.dev.yml logs clickhouse --tail=30; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do
              if nc -z localhost 7233 2>/dev/null; then echo "Temporal ready after ${i}x5s"; break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "Still waiting for Temporal ($i/60)..."; fi
              sleep 5
            done
            nc -z localhost 7233 || echo "Temporal not ready (continuing anyway, some tests may fail)"
            echo "Services ready"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Calibrate ee/hogai test durations for this hardware
          # ee/hogai/ tests are uniformly ~7x slower on CCI than what's recorded
          # in .test_durations (recorded on a faster runner). With duration_based_chunks
          # this caused the entire ee/hogai/ tree to clump onto one shard (worst-case
          # 52min vs 18min median). Multiplying ee/hogai/ entries by 7 makes the
          # chunker spread that directory across ~9 contiguous shards instead of one,
          # without disturbing test ordering (so snapshot/materialization tests still
          # see their dependent tests on the same shard).
          # NOTE: heredoc avoided because '<<' clashes with CCI parameter syntax.
          command: |
            python3 -c "
            import json, pathlib
            p = pathlib.Path('.test_durations')
            d = json.loads(p.read_text())
            n = sum(1 for k in d if k.startswith('ee/hogai/'))
            for k in list(d.keys()):
                if k.startswith('ee/hogai/'):
                    d[k] = d[k] * 7.0
            p.write_text(json.dumps(d, indent=4))
            print(f'Calibrated {n} ee/hogai/ entries (multiplied by 7x)')
            "
      - run:
          name: Run Django << parameters.segment >> tests (shard << parameters.group >>/<< parameters.concurrency >>)
          command: |
            set +e
            # Mirror GHA POE matrix exactly:
            # 1. --snapshot-update --snapshot-warn-unused (GHA: "we ignore snapshot divergence there")
            # 2. --ignore=posthog/hogql_queries --ignore=posthog/hogql (GHA POE matrix excludes these dirs)
            # 3. Different test path subset (GHA POE matrix runs a focused subset)
            if [ "<< parameters.segment >>" = "Core" ]; then
              if [ "<< parameters.person-on-events >>" = "true" ]; then
                export PERSON_ON_EVENTS_V2_ENABLED=true
                # GHA POE matrix test paths (mirror of ci-backend.yml line ~1290):
                #   ./posthog/clickhouse/ ./posthog/queries/ ./posthog/api/test/test_insight* ./posthog/api/test/dashboards/test_dashboard.py
                # Plus ee/clickhouse/ from the conditional. We use shell glob via ls -d.
                TEST_PATHS=$(ls -d posthog/clickhouse posthog/queries posthog/api/test/test_insight*.py posthog/api/test/dashboards/test_dashboard.py ee/clickhouse 2>/dev/null | tr '\n' ' ')
                POE_PYTEST_ARGS="--snapshot-update --snapshot-warn-unused --ignore=posthog/hogql_queries --ignore=posthog/hogql"
                # SANITY: print resolved POE paths so we can confirm parity with GHA's hardcoded list.
                echo "=== POE expanded test paths (compare against GHA ci-backend.yml hardcoded list) ==="
                for p in $TEST_PATHS; do echo "  $p"; done
                echo "=========================================================================="
              else
                TEST_PATHS="posthog ee/"
                POE_PYTEST_ARGS=""
              fi
              uv run python -m pytest -v --tb=short \
                $TEST_PATHS \
                -m "not async_migrations" \
                --ignore=posthog/temporal --ignore=posthog/dags --ignore=common/hogvm/python/test \
                $POE_PYTEST_ARGS \
                --splits << parameters.concurrency >> --group << parameters.group >> \
                --durations=100 --durations-min=1.0 \
                --splitting-algorithm=duration_based_chunks \
                --reruns 2 --reruns-delay 1 \
                -r fEsxX \
                --junitxml=junit-<< parameters.segment >>-<< parameters.group >>.xml
            elif [ "<< parameters.segment >>" = "Temporal" ]; then
              uv run python -m pytest -v --tb=short \
                posthog/temporal \
                --splits << parameters.concurrency >> --group << parameters.group >> \
                --durations=100 --durations-min=1.0 \
                --splitting-algorithm=duration_based_chunks \
                --reruns 2 --reruns-delay 1 \
                -r fEsxX \
                --junitxml=junit-<< parameters.segment >>-<< parameters.group >>.xml
            fi
            exit_code=$?
            set -e
            if [ $exit_code -eq 5 ]; then
              echo "No tests collected for this shard"
              exit 0
            else
              exit $exit_code
            fi
          no_output_timeout: 30m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"
      - store_test_results:
          path: junit-<< parameters.segment >>-<< parameters.group >>.xml

  # ==========================================================================
  # RUST CI — Build + Test (needs Docker Compose for services)
  # ==========================================================================
  rust-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_RUST_BUILD=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install system dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
