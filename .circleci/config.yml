            sudo npm install -g pnpm || corepack enable
            pnpm setup || true
            echo 'export PNPM_HOME="/home/circleci/.local/share/pnpm"' >> "$BASH_ENV"
            echo 'export PATH="$PNPM_HOME:$PATH"' >> "$BASH_ENV"
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: |
            pnpm --filter=@posthog/storybook... install --frozen-lockfile
            # Use npm for global utilities — pnpm exits non-zero when PNPM_HOME isn't in root's PATH
            sudo npm install -g http-server wait-on
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Serve Storybook
          command: pnpm exec http-server common/storybook/dist --port 6006 --silent
          background: true
      - run:
          name: Wait for Storybook
          command: pnpm wait-on http://127.0.0.1:6006 --timeout 60
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run visual regression tests (<< parameters.browser >> shard << parameters.shard >>/<< parameters.total-shards >>)
          command: |
            cd common/storybook && pnpm exec test-storybook -u --no-index-json --maxWorkers=1 --browsers << parameters.browser >> --shard << parameters.shard >>/<< parameters.total-shards >> || true
          no_output_timeout: 30m
