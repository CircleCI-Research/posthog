# Path filters for the CircleCI setup stage.
#
# Every top-level key is a pipeline parameter that .circleci/continue-config.yml
# declares. The pattern lists are copied from .github/workflows/ — either from a
# `paths-filter` action block or from a workflow's `on.pull_request.paths` gate.
# The comment above each key names the source.
#
# Matching rules (from .github/actions/paths-filter/README.md):
#   * plain patterns are includes, OR-ed together
#   * a `!` prefix makes the pattern an exclude; one exclude match vetoes the file
#   * a mapping entry (`added|modified: [...]`) limits its patterns to those statuses
#
# A parameter is true when at least one changed file matches. On master every
# parameter is forced true, matching the `if: github.event_name != 'push'` guard
# that skips filtering on the source `changes` jobs.
#
# GENERATED from the GitHub Actions workflows. Inline comments in the source
# filter blocks are not carried over.

