    scripts-tests:
        when: << pipeline.parameters.run-scripts-tests >>
        jobs:
            - scripts-tests

    actionlint:
        when: << pipeline.parameters.run-actionlint >>
        jobs:
            - actionlint

    lint-workflows:
        when: << pipeline.parameters.run-lint-workflows >>
        jobs:
            - lint-workflows

    openapi-codegen:
        when: << pipeline.parameters.run-openapi-codegen >>
        jobs:
            - openapi-codegen-tests

    paths-filter-action:
        when: << pipeline.parameters.run-paths-filter-action >>
        jobs:
            - paths-filter-action-verify

    backend-shadow-drift:
        when: << pipeline.parameters.run-backend-shadow-drift >>
        jobs:
            - backend-shadow-drift

    test-quarantine:
        when: << pipeline.parameters.run-test-quarantine >>
        jobs:
            - test-quarantine-check

    survey-sdk-check:
        when: << pipeline.parameters.run-survey-sdk-check >>
        jobs:
            - survey-sdk-check

    dev-setup:
        when: << pipeline.parameters.run-dev-setup >>
        jobs:
            - dev-setup-flox

    dev-sandbox-selftest:
        when: << pipeline.parameters.run-dev-sandbox-selftest >>
        jobs:
            - dev-sandbox-selftest

    clickhouse-hcl:
        when: << pipeline.parameters.run-clickhouse-hcl >>
        jobs:
            - clickhouse-hcl-guard

    clickhouse-multinode:
        when: << pipeline.parameters.run-clickhouse-multinode >>
        jobs:
            - clickhouse-multinode-migrations

    container-build:
        when: << pipeline.parameters.run-container-build >>
        jobs:
            - docker-build

    dockerfile-lint:
        when: << pipeline.parameters.run-dockerfile-lint >>
        jobs:
            - dockerfile-lint

    dockerignore-guard:
        when: << pipeline.parameters.run-dockerignore-guard >>
        jobs:
            - dockerignore-guard

    nodejs-container:
        when: << pipeline.parameters.run-nodejs-container >>
        jobs:
            - nodejs-container-build

    desktop-quality:
        when: << pipeline.parameters.run-desktop-quality >>
        jobs:
            - desktop-quality

    desktop-code:
        when: << pipeline.parameters.run-desktop-code >>
        jobs:
            - desktop-build
            - desktop-typecheck
            - desktop-unit-test
            - desktop-integration-test

    desktop-packages:
        when: << pipeline.parameters.run-desktop-packages >>
        jobs:
            - desktop-e2e

    terragrunt:
        when: << pipeline.parameters.run-terragrunt >>
        jobs:
            - terragrunt-plan

    semgrep-python:
        when: << pipeline.parameters.run-semgrep-python >>
        jobs:
            - semgrep:
                  name: semgrep-python
                  scan-name: python
                  args: >-
                      --config p/python --config p/owasp-top-ten --config p/security-audit
                      --config p/trailofbits --config .semgrep/rules/security
                      --exclude-rule trailofbits.generic.redis-unencrypted-transport.redis-unencrypted-transport
                      --exclude-rule python.django.security.audit.csrf-exempt.no-csrf-exempt
                      --exclude-rule generic.html-templates.security.var-in-href.var-in-href
                      --include /bin --include /common --include /ee --include /posthog
                      --include /products --include /services/llm-gateway
                      --include /services/stripe-mock --include /tools
                      --exclude products/desktop --jobs 4

    semgrep-go:
        when: << pipeline.parameters.run-semgrep-go >>
        jobs:
            - semgrep:
                  name: semgrep-go
                  scan-name: go
                  args: >-
                      --config p/golang --config p/owasp-top-ten --config p/security-audit
                      --config p/trailofbits --config r/go.lang.security
                      --exclude-rule go.lang.security.audit.xss.no-fprintf-to-responsewriter.no-fprintf-to-responsewriter
                      --include /livestream

    semgrep-rust:
        when: << pipeline.parameters.run-semgrep-rust >>
        jobs:
            - semgrep:
                  name: semgrep-rust
                  scan-name: rust
                  args: >-
                      --config p/rust --config p/owasp-top-ten --config p/security-audit
                      --config p/trailofbits --config r/rust.lang.security
                      --exclude-rule trailofbits.generic.curl-unencrypted-url.curl-unencrypted-url
                      --exclude-rule trailofbits.generic.redis-unencrypted-transport.redis-unencrypted-transport
                      --exclude-rule trailofbits.rs.panic-in-function-returning-result.panic-in-function-returning-result
                      --include /cli --include /rust

    semgrep-js:
        when: << pipeline.parameters.run-semgrep-js >>
        jobs:
            - semgrep:
                  name: semgrep-js
                  scan-name: js
                  args: >-
                      --config .semgrep/rules/security --config p/javascript
                      --config p/owasp-top-ten --config p/security-audit --config p/trailofbits
                      --include /frontend --include /nodejs --include /services/agent-proxy
                      --include /services/integration-service --include /services/mcp
                      --include /services/oauth-proxy --include /services/stripe-app

    semgrep-products-frontend:
        when: << pipeline.parameters.run-semgrep-products-frontend >>
        jobs:
            - semgrep:
                  name: semgrep-products-frontend
                  scan-name: products-frontend
                  args: --config .semgrep/rules/security/prefer-codegen-api.yaml --include /products

    semgrep-general:
        when: << pipeline.parameters.run-semgrep-general >>
        jobs:
            - semgrep:
                  name: semgrep-general
                  scan-name: general
                  args: >-
                      --config p/owasp-top-ten --config p/security-audit --config p/trailofbits
                      --config p/github-actions
                      --exclude-rule dockerfile.security.no-sudo-in-dockerfile.no-sudo-in-dockerfile
                      --exclude-rule trailofbits.generic.redis-unencrypted-transport.redis-unencrypted-transport
                      --exclude-rule trailofbits.yaml.docker-compose.port-all-interfaces.port-all-interfaces
                      --exclude-rule yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
                      --exclude /cli --exclude /common --exclude /ee --exclude /frontend
                      --exclude /livestream --exclude /nodejs --exclude /posthog
                      --exclude /products --exclude /rust --exclude /.semgrep
                      --exclude /docs --exclude /services --jobs 4

    semgrep-devex:
        when: << pipeline.parameters.run-semgrep-devex >>
        jobs:
            - semgrep:
                  name: semgrep-devex
                  scan-name: devex
                  severity: ERROR
                  args: --config .semgrep/rules/devex/

    semgrep-desktop:
        when: << pipeline.parameters.run-semgrep-desktop >>
        jobs:
            - semgrep:
                  name: semgrep-desktop
                  scan-name: desktop
                  args: --config p/javascript --config p/python --include /products/desktop

    semgrep-test-rules:
        when: << pipeline.parameters.run-semgrep-test-rules >>
        jobs:
            - semgrep-rule-tests
